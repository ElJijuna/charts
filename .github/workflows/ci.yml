name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix example ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run lint:md
      - run: npm run typecheck
      - run: npm run test:coverage -- --runInBand
      - run: npm run build
      - run: npm pack --dry-run
